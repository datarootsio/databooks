[tool.poetry]
name = "databooks"
version = "0.0.0-dev"  # dynamically set in CI
description = "A CLI tool to resolve git conflicts and remove metadata in notebooks."
authors = ["Murilo Cunha <murilo@dataroots.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://datarootsio.github.io/databooks/"
repository = "https://github.com/datarootsio/databooks/"
keywords = ["jupyter-notebooks", "cli"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[tool.poetry.scripts]
databooks = "databooks.cli:app"

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.27.3"
rich = "^15.0.0"
pydantic = "^2.14.1"
GitPython = "^3.2.1"
tomli = "^2.5.0"
typing-extensions = "^4.16.0"


[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"

[tool.poetry.group.dev.dependencies]
black = { version = "^26.10.1", python = ">=3.11" }
isort = { version = "^9.0.2", python = ">=3.11" }
codespell = { version = "^2.4.3", python = ">=3.11" }
pre-commit = { version = "^4.7.0", python = ">=3.11" }
mypy = { version = "^2.4.0", python = ">=3.11" }
cogapp = { version = "^3.6.0", python = ">=3.11" }
mike = { version = "^2.2.0", python = ">=3.11" }
mkdocstrings = { version = "^1.0.7", extras = ["python"], python = ">=3.11" }
mkdocs-material = { version = "^9.7.7", python = ">=3.11" }
mkdocs-autorefs = { version = "^1.4.4", python = ">=3.11" }
mkdocs-coverage = { version = "^2.0.1", python = ">=3.11" }
pip-audit = { version = "^2.10.1", python = ">=3.11" }

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Formatting and type checking configuration
[tool.black]
include = "(databooks/|tests/|scripts/)"
extend-exclude = "tests/files/"

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["databooks", "tests"]
show_error_codes = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_no_return = false

[tool.isort]
skip_glob = ["docs/*"]
profile = "black"
