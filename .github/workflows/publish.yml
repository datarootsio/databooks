name: publish
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  validate:
    if: github.event.created == true && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate exact version, event commit, and main ancestry
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/release.py validate "$RELEASE_VERSION" --commit "$GITHUB_SHA"

  tests:
    needs: validate
    # The relative path uses the reusable workflow from this same tagged commit.
    uses: ./.github/workflows/tests.yml
    with:
      release-version: ${{ github.ref_name }}

  publish:
    runs-on: ubuntu-22.04
    needs: [validate, tests]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: python -m pip install poetry==2.3.2
      - name: Stamp package and runtime versions from the tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/release.py prepare "$RELEASE_VERSION"
      - name: Build release packages
        run: poetry build
      - name: Publish to TestPyPI and PyPI
        env:
          POETRY_REPOSITORIES_TEST_PYPI_URL: https://test.pypi.org/legacy/
          POETRY_PYPI_TOKEN_TEST_PYPI: ${{ secrets.TEST_PIPY_TOKEN }}
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PIPY_TOKEN }}
        run: |
          poetry publish --no-interaction -r test-pypi
          poetry publish --no-interaction

  release:
    runs-on: ubuntu-22.04
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Create GitHub release with generated notes
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_VERSION,
              generate_release_notes: true
            });

  docs:
    runs-on: ubuntu-22.04
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.3.2
          poetry install --no-interaction --no-ansi
      - name: Stamp docs version from the tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: poetry run python scripts/release.py prepare "$RELEASE_VERSION"
      - name: Configure git user
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Create coverage report
        run: poetry run pytest --cov-report html --cov=databooks tests/
      - name: Deploy versioned docs and update latest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          poetry run mike deploy --update-aliases "$RELEASE_VERSION" latest
          poetry run mike set-default --push latest
