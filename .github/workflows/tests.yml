name: tests
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      release-version:
        description: Tag version to stamp for release tests; omitted for branch and PR CI
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      # Run the pinned development hooks on a single tooling interpreter.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.5.1 pip-audit==2.10.1
          poetry install --no-interaction --no-ansi
      - name: Set hook cache
        run: echo "PRE_COMMIT_HOME=$RUNNER_TEMP/pre-commit" >> "$GITHUB_ENV"
      - name: Initialize every hook environment
        run: poetry run pre-commit install-hooks
      - name: QA with flake8, black, isort and mypy
        run: poetry run pre-commit run --all-files
      - name: Audit QA and initialized Python hooks
        if: always()
        run: >-
          python scripts/audit.py
          --python "$(poetry env info --executable)"
          --hooks "$PRE_COMMIT_HOME" --output audit-reports/qa
      - name: Configure git user for QA tests
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Strict documentation build with coverage pages
        run: |
          poetry run pytest --cov=databooks --cov-report=html
          poetry run mkdocs build --strict
      - name: Retain QA vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: audit-qa
          path: audit-reports/
          if-no-files-found: error

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.5.1 pip-audit==2.10.1
          poetry install --only main --no-interaction --no-ansi
      - name: Audit frozen runtime environment
        id: runtime-audit
        run: >-
          python scripts/audit.py --python "$(poetry env info --executable)"
          --output audit-reports/runtime
      - name: Install test and development dependencies
        if: success() || steps.runtime-audit.outcome == 'failure'
        run: poetry sync --no-interaction --no-ansi
      - name: Audit frozen development environment
        if: success() || steps.runtime-audit.outcome == 'failure'
        run: >-
          python scripts/audit.py --python "$(poetry env info --executable)"
          --output audit-reports/development
      - name: Configure git user for git unit tests
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Stamp release metadata from the tag
        if: inputs.release-version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: poetry run python scripts/release.py prepare "$RELEASE_VERSION"
      - name: Unit tests and coverage
        run: poetry run pytest -vv --cov=./ --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v7.1.1
        continue-on-error: true
        with:
          fail_ci_if_error: false
      - name: Retain vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: audit-python-${{ matrix.python-version }}
          path: audit-reports/
          if-no-files-found: error
