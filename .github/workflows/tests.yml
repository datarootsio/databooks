name: tests
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      release-version:
        description: Tag version to stamp for release tests; omitted for branch and PR CI
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # Only uv-managed interpreters: never fall back to the runner's system Python.
  UV_MANAGED_PYTHON: "1"

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      # Run the pinned development hooks on a single tooling interpreter.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.1"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz for this uv version; bump it
          # with `version` in every setup-uv step (setup-uv's table stops at 0.13.0)
          checksum: "eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220"
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --locked
      - name: Set hook cache
        run: echo "PRE_COMMIT_HOME=$RUNNER_TEMP/pre-commit" >> "$GITHUB_ENV"
      - name: Initialize every hook environment
        run: uv run --no-sync pre-commit install-hooks
      - name: QA with ruff, ty and codespell
        run: uv run --no-sync pre-commit run --all-files
      - name: Audit QA and initialized Python hooks
        if: always()
        run: >-
          uv run --no-project --with pip-audit==2.10.1 scripts/audit.py
          --python .venv/bin/python
          --hooks "$PRE_COMMIT_HOME" --output audit-reports/qa
      # Exercise the build backend on every change, before tests and docs generate
      # files (hatchling honours .gitignore and the sdist has an explicit include
      # list, so this guards that selection). The smoke test installs the wheel
      # with the locked (and audited) runtime set, hash-checked.
      - name: Build and check release packages
        run: |
          uv build --no-sources
          uvx twine==7.0.0 check --strict dist/*
          uv export -q --frozen --no-default-groups --no-emit-project -o "$RUNNER_TEMP/runtime.txt"
          uv venv -q "$RUNNER_TEMP/smoke"
          uv pip install -q --no-build --python "$RUNNER_TEMP/smoke" -r "$RUNNER_TEMP/runtime.txt" dist/databooks-*.whl
          uv pip check --python "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/databooks" --version
      - name: Configure git user for QA tests
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Strict documentation build with coverage pages
        run: |
          uv run --no-sync pytest --cov=databooks --cov-report=html
          uv run --no-sync mkdocs build --strict
      - name: Retain QA vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: audit-qa
          path: audit-reports/
          if-no-files-found: error

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.1"
          checksum: "eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --no-default-groups
      - name: Audit frozen runtime environment
        id: runtime-audit
        run: >-
          uv run --no-project --with pip-audit==2.10.1 scripts/audit.py
          --python .venv/bin/python --output audit-reports/runtime
      - name: Install test and development dependencies
        if: success() || steps.runtime-audit.outcome == 'failure'
        run: uv sync --locked
      - name: Audit frozen development environment
        if: success() || steps.runtime-audit.outcome == 'failure'
        run: >-
          uv run --no-project --with pip-audit==2.10.1 scripts/audit.py
          --python .venv/bin/python --output audit-reports/development
      - name: Configure git user for git unit tests
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Stamp release metadata from the tag
        if: inputs.release-version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: uv run --no-project scripts/release.py prepare "$RELEASE_VERSION"
      - name: Unit tests and coverage
        run: uv run --no-sync pytest -vv --cov=./ --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v7.1.1
        continue-on-error: true
        with:
          fail_ci_if_error: false
      - name: Retain vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: audit-python-${{ matrix.python-version }}
          path: audit-reports/
          if-no-files-found: error
