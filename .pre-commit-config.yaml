default_language_version:
    python: python3.11
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language: system
        entry: poetry run black
        files: (databooks/|tests/|scripts/)
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        language: system
        entry: poetry run isort
        files: (databooks/|tests/|scripts/)
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        args: ["--extend-ignore=W604,E231"]
        files: (databooks/|tests/|scripts/)
        additional_dependencies:
          - flake8-docstrings==1.7.0
          - flake8-print==5.0.0
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        language: system
        entry: poetry run codespell
  - repo: local
    hooks:
      - id: mypy
        name: mypy (locked project environment)
        entry: poetry run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: update-docs
        name: update-docs
        entry: poetry run cog -r
        language: system
        files: (.*\.md$)
        args: ["*/*/*.md", "*/*.md", "*.md"]
        always_run: true
        pass_filenames: false
