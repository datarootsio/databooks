default_language_version:
    python: python3.11
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (locked project environment)
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: (databooks/|tests/|scripts/)
      - id: ruff-format
        name: ruff format (locked project environment)
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: (databooks/|tests/|scripts/)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        language: system
        entry: uv run --locked codespell
  - repo: local
    hooks:
      - id: mypy
        name: mypy (locked project environment)
        entry: poetry run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: update-docs
        name: update-docs
        entry: uv run --locked cog -r
        language: system
        files: (.*\.md$)
        args: ["*/*/*.md", "*/*.md", "*.md"]
        always_run: true
        pass_filenames: false
